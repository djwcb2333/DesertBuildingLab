name: Repository checks
on:
  push:
  pull_request:
jobs:
  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Check manifests, links and publication boundaries
        run: python Tools/verify_repository.py
